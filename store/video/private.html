<!doctype html>
<html><head><meta charset="utf-8"><title>private</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#071b42}
body{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background-size:cover;animation:blur 1s ease-out 0s both}
.shade{position:absolute;inset:0;background:radial-gradient(70% 70% at 50% 45%,rgba(7,27,66,.55),rgba(7,27,66,.88));animation:fade 1s ease-out 0s both}
.lock{position:absolute;left:50%;top:150px;width:260px;height:300px;margin-left:-130px;animation:pop .7s cubic-bezier(.3,1.6,.5,1) .3s both}
.shackle{animation:close .3s cubic-bezier(.6,0,.4,1) 1.05s both}
.ring{position:absolute;left:50%;top:300px;width:20px;height:20px;margin:-10px;border-radius:50%;border:4px solid #f6b73c;animation:ring .7s ease-out 1.3s both}
.pills{position:absolute;left:0;right:0;top:520px;display:flex;justify-content:center;gap:28px}
.pill{font-size:46px;font-weight:700;padding:14px 38px;border-radius:999px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}
.pill:nth-child(2){background:#f6b73c;color:#1b1300;box-shadow:none}
.pill:nth-child(1){animation:up .5s ease-out 1.5s both}
.pill:nth-child(2){animation:up .5s ease-out 1.8s both}
.pill:nth-child(3){animation:up .5s ease-out 2.1s both}
.sub{position:absolute;left:0;right:0;top:680px;text-align:center;font-size:34px;color:#d7e6f2;animation:up .6s ease-out 2.6s both}
@keyframes blur{0%{filter:blur(0)}100%{filter:blur(10px)}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:none;opacity:1}}
@keyframes close{0%{transform:translateY(-34px)}100%{transform:none}}
@keyframes ring{0%{transform:scale(1);opacity:1}100%{transform:scale(16);opacity:0}}
@keyframes up{0%{opacity:0;transform:translateY(26px)}100%{opacity:1;transform:none}}
*{animation-play-state:paused!important}
</style></head>
<body>
<div class="bg" id="bg"></div><div class="shade"></div>
<div class="ring"></div>
<svg class="lock" viewBox="0 0 260 300">
  <g class="shackle"><path d="M70 140V95a60 60 0 0 1 120 0v45" fill="none" stroke="#e9eef3" stroke-width="26" stroke-linecap="round"/></g>
  <rect x="30" y="130" width="200" height="160" rx="30" fill="#f6b73c"/>
  <circle cx="130" cy="195" r="20" fill="#1b1300"/><rect x="121" y="200" width="18" height="44" rx="9" fill="#1b1300"/>
</svg>
<div class="pills"><div class="pill">Free</div><div class="pill">Private</div><div class="pill">Open source</div></div>
<div class="sub">No accounts. No tracking. Your files never leave your computer.</div>
<script>
window.seek = (ms) => { for (const a of document.getAnimations()) a.currentTime = ms; };
window.setBg = (url) => new Promise((r) => { const i = new Image(); i.onload = r; i.onerror = r; i.src = url; document.getElementById("bg").style.backgroundImage = `url(${url})`; });
</script>
</body></html>
