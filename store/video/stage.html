<!doctype html>
<html><head><meta charset="utf-8"><title>stage</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(120% 140% at 100% 100%,#0e8a8f 0%,#0b5878 38%,#0a2a5c 72%,#071b42 100%)}
.win{position:absolute;border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.14)}
.win[hidden]{display:none}
/* browser */
.b{--strip:#dfe3e8;--bar:#fff;--omni:#eef1f4;--ink:#1f2328;--muted:#5f6368;--line:#d5d9de}
.b.dark{--strip:#1b1e23;--bar:#2a2e35;--omni:#1b1e23;--ink:#e6e8eb;--muted:#9aa0a6;--line:#3a3f47}
.strip{height:42px;background:var(--strip);display:flex;align-items:flex-end;padding-left:10px;position:relative}
.tab{width:280px;height:34px;background:var(--bar);border-radius:9px 9px 0 0;display:flex;align-items:center;gap:9px;padding:0 12px;color:var(--ink);font-size:13px}
.tab .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab svg,.newtab svg{flex:none}
.newtab{width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.wc{position:absolute;right:0;top:0;height:34px;display:flex}
.wc span{width:46px;display:grid;place-items:center;color:var(--ink)}
.bar{height:46px;background:var(--bar);display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);color:var(--muted)}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.ib.on{background:var(--omni)}
.omni{flex:1;height:34px;border-radius:17px;background:var(--omni);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:14.5px;color:var(--ink);margin:0 6px}
.omni .sch{color:var(--muted);padding-right:10px;border-right:1px solid var(--line)}
.ib img{width:20px;height:20px}
.content{position:relative;overflow:hidden;background:#fff}
.content img{position:absolute;left:0;top:0;display:block}
#wipeBar{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:#f6b73c;box-shadow:0 0 24px 8px rgba(246,183,60,.75);display:none}
/* editor */
.e{background:#fff}
.etitle{height:36px;background:#f3f3f3;display:flex;align-items:center;gap:10px;padding-left:14px;font-size:13px;color:#1f2328;position:relative}
.etitle .wc{height:36px}
.emenu{height:30px;background:#f3f3f3;display:flex;gap:20px;align-items:center;padding-left:16px;font-size:13px;color:#333;border-bottom:1px solid #e1e1e1}
.ebody{position:relative;overflow:hidden;font:15.5px/26px "Cascadia Mono",Consolas,monospace;color:#24292f;background:#fff}
.ln{display:flex;height:26px;white-space:pre}
.ln .no{width:56px;flex:none;text-align:right;padding-right:16px;color:#a0a7b0}
.ln.cur{background:#f4f7fb}
.ln.cur .no{color:#24292f}
.h{color:#0b5878;font-weight:700}.mk{color:#c05621}.dim{color:#8b949e}
.caret{display:inline-block;width:2px;height:20px;background:#0b5878;vertical-align:-4px;margin-left:-1px;margin-right:-1px}
.estatus{height:26px;background:#f3f3f3;border-top:1px solid #e1e1e1;display:flex;gap:26px;align-items:center;padding:0 16px;font-size:12.5px;color:#555}
.estatus .saved{margin-left:auto;color:#1a7f37;font-weight:600}
/* overlays */
#popup{position:absolute;border-radius:8px;overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.12);transform-origin:top right;display:none}
#popup img{display:block}
#dropdown{position:absolute;display:none;border-radius:6px;padding:4px 0;font-size:16px;box-shadow:0 10px 28px rgba(0,0,0,.3);background:#fff;color:#1f2328;border:1px solid #d0d7de}
#dropdown.dark{background:#2b2f36;color:#e6e8eb;border-color:#444c56}
#dropdown div{padding:4px 12px;height:30px;line-height:22px}
#dropdown div.hi{background:#0b62c4;color:#fff}
#keys{position:absolute;display:none;gap:10px;align-items:center;font:600 26px "Segoe UI",sans-serif;color:#fff;padding:14px 22px;border-radius:14px;background:rgba(7,27,66,.82);box-shadow:0 12px 30px rgba(0,0,0,.35)}
#keys kbd{font:inherit;padding:6px 14px;border-radius:8px;background:#f6b73c;color:#1b1300;box-shadow:0 3px 0 #b07d16}
#cursor{position:absolute;left:0;top:0;width:30px;height:40px;transform-origin:0 0;display:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));z-index:10}
#ripple{position:absolute;border-radius:50%;border:3px solid #f6b73c;background:rgba(246,183,60,.25);display:none;z-index:9}
</style></head>
<body>
<div class="win b" id="browser" hidden>
  <div class="strip">
    <div class="tab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg><span class="t" id="tabTitle"></span><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
    <div class="newtab"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
    <div class="wc"><span><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor"><path d="M1 6h10"/></svg></span><span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"><rect x="1.5" y="1.5" width="9" height="9"/></svg></span><span><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor"><path d="M1 1l10 10M11 1L1 11"/></svg></span></div>
  </div>
  <div class="bar">
    <span class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span>
    <span class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".45"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    <span class="ib"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></span>
    <div class="omni"><span class="sch">File</span><span id="url"></span></div>
    <span class="ib" id="extBtn"><img src="../../extension/public/icons/32.png" alt=""></span>
    <span class="ib"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></span>
  </div>
  <div class="content" id="content"><img id="layerA" alt=""><img id="layerB" alt=""><div id="wipeBar"></div></div>
</div>

<div class="win e" id="editor" hidden>
  <div class="etitle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0b5878" stroke-width="2" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg><span id="edTitle"></span>
    <div class="wc"><span><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor"><path d="M1 6h10"/></svg></span><span><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"><rect x="1.5" y="1.5" width="9" height="9"/></svg></span><span><svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor"><path d="M1 1l10 10M11 1L1 11"/></svg></span></div></div>
  <div class="emenu"><span>File</span><span>Edit</span><span>View</span></div>
  <div class="ebody" id="edBody"></div>
  <div class="estatus"><span id="edPos"></span><span>UTF-8</span><span>Markdown</span><span class="saved" id="edSaved"></span></div>
</div>

<div id="popup"><img id="popupImg" alt=""></div>
<div id="dropdown"></div>
<div id="keys"><kbd>Ctrl</kbd>+<kbd>S</kbd></div>
<div id="ripple"></div>
<svg id="cursor" viewBox="0 0 24 32"><path d="M1.5 1.5v24.5l6.2-6 4.3 10 4.4-1.9-4.3-9.8h8.7z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function place(el, x, y, w, h) { Object.assign(el.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" }); }

window.S = {
  // cfg.browser / cfg.editor: { x, y, w, h } where w/h are the content area in px.
  setup(cfg) {
    const b = $("browser"), e = $("editor");
    b.hidden = !cfg.browser; e.hidden = !cfg.editor;
    if (cfg.browser) {
      const { x, y, w, h } = cfg.browser;
      place(b, x, y, w, h + 88);
      place($("content"), 0, 0, w, h); $("content").style.position = "relative";
      b.classList.toggle("dark", !!cfg.browser.dark);
      $("layerB").style.display = "none"; $("wipeBar").style.display = "none";
    }
    if (cfg.editor) {
      const { x, y, w, h } = cfg.editor;
      place(e, x, y, w, h + 92);
      $("edBody").style.height = h + "px";
    }
    $("popup").style.display = "none"; $("dropdown").style.display = "none"; $("keys").style.display = "none";
    return { content: rect($("content")), extBtn: rect($("extBtn")), edBody: cfg.editor ? rect($("edBody")) : null, editor: cfg.editor ? rect(e) : null };
  },
  async layer(id, url) {
    const img = $(id);
    img.src = url;
    await img.decode().catch(() => {});
  },
  set(p) {
    if (p.title !== undefined) $("tabTitle").textContent = p.title;
    if (p.url !== undefined) $("url").textContent = p.url;
    if (p.dark !== undefined) $("browser").classList.toggle("dark", p.dark);
    if (p.wipe !== undefined) {
      const B = $("layerB"), bar = $("wipeBar"), W = $("content").clientWidth;
      if (p.wipe === null) { B.style.display = "none"; bar.style.display = "none"; }
      else {
        B.style.display = "block";
        B.style.clipPath = `inset(0 ${(1 - p.wipe) * 100}% 0 0)`;
        bar.style.display = p.wipe > 0 && p.wipe < 1 ? "block" : "none";
        bar.style.left = p.wipe * W + "px";
      }
    }
    if (p.cursor) {
      const c = $("cursor");
      c.style.display = p.cursor.show === false ? "none" : "block";
      c.style.transform = `translate(${p.cursor.x}px, ${p.cursor.y}px) scale(${p.cursor.down ? 0.88 : 1})`;
    }
    if (p.ripple !== undefined) {
      const r = $("ripple");
      if (!p.ripple) r.style.display = "none";
      else {
        const rad = 10 + 34 * p.ripple.t;
        r.style.display = "block";
        place(r, p.ripple.x - rad, p.ripple.y - rad, rad * 2, rad * 2);
        r.style.opacity = String(1 - p.ripple.t);
      }
    }
    if (p.popup !== undefined) {
      const pop = $("popup");
      if (!p.popup) pop.style.display = "none";
      else {
        pop.style.display = "block";
        pop.style.left = p.popup.x + "px"; pop.style.top = p.popup.y + "px";
        const t = p.popup.t ?? 1;
        pop.style.opacity = String(t);
        pop.style.transform = `scale(${0.94 + 0.06 * t})`;
      }
    }
    if (p.dropdown !== undefined) {
      const d = $("dropdown");
      if (!p.dropdown) d.style.display = "none";
      else {
        const { x, y, w, items, hi, dark } = p.dropdown;
        d.style.display = "block"; d.style.left = x + "px"; d.style.top = y + "px"; d.style.width = w + "px";
        d.classList.toggle("dark", !!dark);
        d.innerHTML = items.map((t, i) => `<div class="${i === hi ? "hi" : ""}">${esc(t)}</div>`).join("");
      }
    }
    if (p.keys !== undefined) {
      const k = $("keys");
      if (!p.keys) k.style.display = "none";
      else { k.style.display = "flex"; k.style.left = p.keys.x + "px"; k.style.top = p.keys.y + "px"; k.style.opacity = String(p.keys.t ?? 1); }
    }
    if (p.editor) {
      const ed = p.editor;
      $("edTitle").textContent = (ed.dirty ? "● " : "") + ed.name + " - Text Editor";
      $("edSaved").textContent = ed.saved ?? "";
      $("edPos").textContent = `Ln ${ed.caretLine + 1}, Col ${ed.caretCol + 1}`;
      const rows = [];
      for (let i = ed.top; i < Math.min(ed.lines.length, ed.top + 40); i++) {
        let text = ed.lines[i];
        let html;
        if (i === ed.caretLine && ed.caretOn) html = colour(text.slice(0, ed.caretCol)) + '<span class="caret"></span>' + colour(text.slice(ed.caretCol));
        else html = colour(text);
        rows.push(`<div class="ln${i === ed.caretLine ? " cur" : ""}"><span class="no">${i + 1}</span><span>${html}</span></div>`);
      }
      $("edBody").innerHTML = rows.join("");
    }
  },
  pos(id) { return rect($(id)); },
};
function rect(el) { const r = el.getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height }; }
function colour(t) {
  if (/^#{1,6} /.test(t)) return `<span class="h">${esc(t)}</span>`;
  const m = t.match(/^(\s*- \[[ x]\] |\s*[-*] |\s*\d+\. |> )(.*)$/);
  if (m) return `<span class="mk">${esc(m[1])}</span>${esc(m[2])}`;
  return esc(t);
}
</script>
</body></html>
